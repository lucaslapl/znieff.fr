; Pool PHP-FPM « www » : sert le site public (pages Inertia, exports,
; sitemap).
[www]
user = www-data
group = www-data

listen = /run/php/www.sock
listen.owner = www-data
listen.group = www-data

; L'héritage des variables d'environnement du conteneur (DB_HOST=postgis,
; PORTAIL_INPN_DIR=/data/inpn-data…) est indispensable : sans clear_env=no,
; les workers reliraient le .env bind-mounté au lieu de la config Docker.
clear_env = no

pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
