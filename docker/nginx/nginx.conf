user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Les surcouches GeoJSON précalculées (public/geo) sont servies en
    # statique : compressées et avec un cache navigateur long (elles ne
    # changent qu'au rafraîchissement annuel des référentiels).
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/geo+json image/svg+xml;
    gzip_comp_level 5;

    server {
        listen 8000;
        server_name _;

        root /var/www/html/public;
        index index.php;

        charset utf-8;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        # GeoJSON précalculés : statiques, cache long, jamais via PHP.
        location ^~ /geo/ {
            add_header Cache-Control "public, max-age=86400";
            add_header Access-Control-Allow-Origin "*";
            try_files $uri =404;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param HTTP_HOST $http_host;
            fastcgi_pass unix:/run/php/www.sock;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
